name: GraalVM Build

on:
  push:
    branches: [ main ]
    paths:
      - 'src/main/java/it/baccan/porttest/*.*'
      - '.github/workflows/graalvm.yml'
      - 'pom.xml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/main/java/it/baccan/porttest/*.*'
      - '.github/workflows/graalvm.yml'
      - 'pom.xml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the native executable as a GitHub release'
        type: boolean
        default: false

jobs:

  build:
    runs-on: ${{ matrix.os }}
    permissions:
      # Required to create the build-* tag and release
      contents: write
    strategy:
      matrix:
        os: [windows-latest]
        #os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          # Allineare la versione con graalvm.version in pom.xml
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows msvc setup
        uses: ilammy/msvc-dev-cmd@v1.13.0
        if: ${{ matrix.os == 'windows-latest' }}

      - name: Call maven
        shell: bash
        run: ./mvnw --no-transfer-progress -B package -Pgraalvm

      - name: Upload Windows binaries as artifact
        if: ${{ matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: PortTest-windows
          path: |
            target/PortTest.exe
            target/*.dll
            target/PortTest-*.exe
            target/PortTest-*.jar

      - name: Package native executable
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        # The native executable needs the AWT/Java DLLs generated next to it
        run: Compress-Archive -Path target/PortTest.exe, target/*.dll -DestinationPath target/PortTest-windows-native.zip

      - name: Create release date
        id: read_release_win
        shell: bash
        run: echo "RELEASE_BODY=$(date "+%Y%m%d-%H%M%S")" >> "$GITHUB_OUTPUT"

      - name: Upload Windows Binaries to Release
        if: ${{ matrix.os == 'windows-latest' && (github.event_name == 'push' || inputs.release) }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: build-${{ steps.read_release_win.outputs.RELEASE_BODY }}
          file: target/PortTest-windows-native.zip
          asset_name: PortTest-windows-native.zip
          release_name: ""
          body: |
            Rilascio Windows del ${{ steps.read_release_win.outputs.RELEASE_BODY }}
